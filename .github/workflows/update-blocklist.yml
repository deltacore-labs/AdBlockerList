name: Update Blocklist

on:
  schedule:
    - cron: '23 4 * * *'  # Täglich 04:23 UTC
  workflow_dispatch:        # Manueller Trigger über GitHub UI

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build blocklist
        run: bash scripts/build.sh

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet blocklist.txt README.md && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push if changed
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add blocklist.txt README.md
          TOTAL=$(grep -cv '^#\|^$' blocklist.txt)
          git commit -m "chore: update blocklist $(date -u +%Y-%m-%d) (${TOTAL} entries)"
          git pull --rebase origin main
          git push
